---
- name: Deploy AWX Infrastructure Demo Website
  hosts: all
  become: true
  gather_facts: true

  tasks:

    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/awx-demo
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate deployment ID
      ansible.builtin.set_fact:
        deployment_id: "{{ ansible_date_time.epoch }}"

    - name: Deploy dynamic website
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /opt/awx-demo/index.html
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx

    - name: Deploy nginx configuration
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /etc/nginx/conf.d/awx-demo.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx

    - name: Remove Rocky Linux default nginx configuration
      ansible.builtin.file:
        path: /etc/nginx/conf.d/welcome.conf
        state: absent
      notify: Restart nginx

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Verify nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test
      changed_when: false

    - name: Verify website
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200
        return_content: true
      register: website

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "========================================"
          - " AWX INFRASTRUCTURE DEPLOYMENT"
          - "========================================"
          - "Server: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Nginx: active"
          - "Managed By: AWX"
          - "Deployment Date: {{ ansible_date_time.date }}"
          - "Deployment ID: {{ deployment_id }}"
          - "Website: deployed successfully"
          - "Website path: /opt/awx-demo/index.html"
          - "Configuration: /etc/nginx/conf.d/awx-demo.conf"
          - "========================================"

  handlers:

    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
