---
- name: Configure Rocky Linux Web Server
  hosts: rocky
  become: true
  gather_facts: true

  tasks:

    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create application user
      ansible.builtin.user:
        name: awx-demo
        state: present
        create_home: true

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/awx-demo
        state: directory
        owner: awx-demo
        group: awx-demo
        mode: '0755'

    - name: Create configuration directory
      ansible.builtin.file:
        path: /opt/awx-demo/config
        state: directory
        owner: awx-demo
        group: awx-demo
        mode: '0755'

    - name: Deploy application configuration
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /opt/awx-demo/config/app.conf
        owner: awx-demo
        group: awx-demo
        mode: '0644'

    - name: Enable nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Deploy custom website
      ansible.builtin.copy:
        src: files/index.html
        dest: /usr/share/nginx/html/index.html
        owner: root
        group: root
        mode: '0644'

    - name: Verify nginx
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "Server: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Nginx: {{ nginx_status.stdout }}"
          - "Configuration: /opt/awx-demo/config/app.conf"
