---
- name: Deploy AWX Infrastructure Demo Website
  hosts: all
  gather_facts: true

  tasks:

    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/awx-demo
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Deploy website
      ansible.builtin.copy:
        src: index.html
        dest: /opt/awx-demo/index.html
        owner: root
        group: root
        mode: "0644"

    - name: Deploy nginx configuration
      ansible.builtin.template:
        src: templates/app.conf.j2
        dest: /etc/nginx/conf.d/awx-demo.conf
        owner: root
        group: root
        mode: "0644"
      notify: Restart nginx

    - name: Remove Rocky Linux default page
      ansible.builtin.file:
        path: /etc/nginx/conf.d/welcome.conf
        state: absent
      notify: Restart nginx

    - name: Enable and start nginx
      ansible.builtin.systemd:
        name: nginx
        enabled: true
        state: started

    - name: Verify nginx configuration
      ansible.builtin.command:
        cmd: nginx -t
      register: nginx_test
      changed_when: false

    - name: Verify website
      ansible.builtin.uri:
        url: http://127.0.0.1
        status_code: 200
        return_content: true
      register: website
      changed_when: false

    - name: Display deployment result
      ansible.builtin.debug:
        msg:
          - "========================================"
          - " AWX INFRASTRUCTURE DEPLOYMENT"
          - "========================================"
          - "Server: {{ ansible_hostname }}"
          - "OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "Nginx: active"
          - "Website: deployed successfully"
          - "Website path: /opt/awx-demo/index.html"
          - "Configuration: /etc/nginx/conf.d/awx-demo.conf"
          - "========================================"

  handlers:

    - name: Restart nginx
      ansible.builtin.systemd:
        name: nginx
        state: restarted
